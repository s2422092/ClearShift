name: Supabase Keep-Alive

on:
  schedule:
    # 毎日 9:00 JST (= 00:00 UTC) に実行
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API to prevent auto-pause
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "::error::SUPABASE_URL secret is not set."
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is not set."
            exit 1
          fi

          echo "Pinging Supabase..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/events?select=id&limit=1")

          echo "HTTP status: $STATUS"

          if [ "$STATUS" = "000" ]; then
            echo "::error::Could not reach Supabase. Check SUPABASE_URL value."
            exit 1
          fi

          echo "Supabase keep-alive ping succeeded (status: $STATUS)."
